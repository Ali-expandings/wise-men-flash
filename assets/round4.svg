<text x="40" y="410" font-size="11" font-weight="400" fill="#818b98" text-anchor="start" >Pre-registered at eight questions and stopped at five at the owner's request, after three questions' scores were known; the writing,</text>
<text x="40" y="426" font-size="11" font-weight="400" fill="#818b98" text-anchor="start" >ethics and personal-decision questions were not run. Intervals resample the five questions (10,000 draws), not judges.</text>
<text x="40" y="442" font-size="11" font-weight="400" fill="#818b98" text-anchor="start" >N = 5 · one top-level model ran every arm · Warp's council on Claude models only · three fresh Opus judges per question · PREREG-4.md</text>
